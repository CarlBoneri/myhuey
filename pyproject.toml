[project]
name = "myhuey"
version = "0.2.0"
description = "Philips Hue room planner and control client"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "requests>=2.32.0",
  "pydantic>=2.9.0",
  "pillow>=11.0",
  "python-multipart>=0.0.9",
  "mcp==2.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]

# What `uv sync` installs by default, so `uv run pytest` works in a fresh clone. Keep it in step
# with the `dev` extra above, which is what `pip install -e '.[dev]'` reads.
[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]

[project.scripts]
myhuey = "myhuey.cli:main"

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"skills" = "myhuey/skills"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
